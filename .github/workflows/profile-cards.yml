name: Generate Profile Cards

on:
  schedule:
    - cron: "30 */6 * * *"   # every 6 hours
  workflow_dispatch:         # run manually from the Actions tab
  push:
    branches: [main]
    paths:
      - ".github/scripts/profile_cards.py"
      - ".github/workflows/profile-cards.yml"

permissions:
  contents: write            # commit the generated SVGs

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Build stats and languages cards
        run: python3 .github/scripts/profile_cards.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}

      - name: Commit changed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/langs.svg
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m ":bar_chart: Update profile cards"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
