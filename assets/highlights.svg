<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="130" viewBox="0 0 1200 130" role="img" aria-label="Highlights: 91.7% sentiment accuracy, 4,420 human-labeled sentences, 1.46M+ tokenizer training sentences, 14 baseline tokenizers benchmarked">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="num" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#7ee787"/>
    </linearGradient>
  </defs>
  <style>
    .n{font:700 40px 'Segoe UI',-apple-system,Helvetica,Arial,sans-serif;fill:url(#num)}
    .l{font:500 14px 'Segoe UI',-apple-system,Helvetica,Arial,sans-serif;fill:#8b949e}
  </style>
  <g>
    <rect x="1" y="1" width="283" height="128" rx="12" fill="url(#card)" stroke="#30363d"/>
    <text class="n" x="142" y="62" text-anchor="middle">91.7%</text>
    <text class="l" x="142" y="94" text-anchor="middle">Sindhi sentiment accuracy</text>
  </g>
  <g>
    <rect x="305" y="1" width="283" height="128" rx="12" fill="url(#card)" stroke="#30363d"/>
    <text class="n" x="446" y="62" text-anchor="middle">4,420</text>
    <text class="l" x="446" y="94" text-anchor="middle">human-labeled sentences</text>
  </g>
  <g>
    <rect x="609" y="1" width="283" height="128" rx="12" fill="url(#card)" stroke="#30363d"/>
    <text class="n" x="750" y="62" text-anchor="middle">1.46M+</text>
    <text class="l" x="750" y="94" text-anchor="middle">tokenizer training sentences</text>
  </g>
  <g>
    <rect x="913" y="1" width="286" height="128" rx="12" fill="url(#card)" stroke="#30363d"/>
    <text class="n" x="1056" y="62" text-anchor="middle">14</text>
    <text class="l" x="1056" y="94" text-anchor="middle">baseline tokenizers benchmarked</text>
  </g>
</svg>
