<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Ali Nawaz — Python Developer, Applied NLP, Sindhi Language Technology">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0f1a"/><stop offset="1" stop-color="#121a33"/></linearGradient>
    <pattern id="ajrak" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M28 4 L52 28 L28 52 L4 28 Z" fill="none" stroke="#e03e52" stroke-width="1.2"/>
      <path d="M28 15 L41 28 L28 41 L15 28 Z" fill="none" stroke="#5c7cfa" stroke-width="1.2"/>
      <circle cx="28" cy="28" r="2.2" fill="#f2d7a3"/>
      <circle cx="0" cy="0" r="1.6" fill="#f2d7a3"/><circle cx="56" cy="0" r="1.6" fill="#f2d7a3"/>
      <circle cx="0" cy="56" r="1.6" fill="#f2d7a3"/><circle cx="56" cy="56" r="1.6" fill="#f2d7a3"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0.35" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="0.9"/></linearGradient>
    <mask id="m"><rect width="1200" height="320" fill="url(#fade)"/></mask>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e03e52"/><stop offset="0.5" stop-color="#f2d7a3"/><stop offset="1" stop-color="#5c7cfa"/></linearGradient>
  </defs>
  <style>
    .caret{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .chip{opacity:0;animation:pop .6s ease-out forwards}
    @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  </style>
  <rect width="1200" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="16" fill="url(#ajrak)" mask="url(#m)" opacity="0.55"/>
  <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="15.5" fill="none" stroke="#26304f" stroke-width="1.5"/>

  <text x="64" y="70" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="16" fill="#38d9a9">$ sindhi-tokenizer --encode "سنڌي ٻولي ٽيڪنالاجي"</text>
  <text x="64" y="150" font-family="'Segoe UI',-apple-system,Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="62" font-weight="800" fill="#e8ecf7" letter-spacing="0.5">Ali Nawaz</text>
  <text x="64" y="190" font-family="'Segoe UI',-apple-system,Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="20" fill="#8b95b3">Python Developer · Applied NLP</text>
  <text x="64" y="222" font-family="'Segoe UI',-apple-system,Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="20" fill="#f2d7a3">Building language technology for Sindhi</text>

  <text x="640" y="170" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" fill="#8b95b3">tokens = [</text>
  
  <g class="chip" style="animation-delay:1.2s">
    <rect x="640" y="196" width="100" height="46" rx="10" fill="#e03e52" fill-opacity="0.14" stroke="#e03e52" stroke-width="1.4"/>
    <text x="690.0" y="227" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI','Arial','DejaVu Sans',sans-serif" font-size="24" fill="#e8ecf7">سنڌي</text>
  </g>
  <g class="chip" style="animation-delay:1.9s">
    <rect x="754" y="196" width="100" height="46" rx="10" fill="#5c7cfa" fill-opacity="0.14" stroke="#5c7cfa" stroke-width="1.4"/>
    <text x="804.0" y="227" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI','Arial','DejaVu Sans',sans-serif" font-size="24" fill="#e8ecf7">ٻولي</text>
  </g>
  <g class="chip" style="animation-delay:2.5999999999999996s">
    <rect x="868" y="196" width="150" height="46" rx="10" fill="#38d9a9" fill-opacity="0.14" stroke="#38d9a9" stroke-width="1.4"/>
    <text x="943.0" y="227" text-anchor="middle" font-family="'Noto Naskh Arabic','Segoe UI','Arial','DejaVu Sans',sans-serif" font-size="24" fill="#e8ecf7">ٽيڪنالاجي</text>
  </g>
  <text x="640" y="274" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" fill="#8b95b3">]  <tspan fill="#38d9a9"># illustrative subword split</tspan><tspan class="caret" fill="#f2d7a3"> ▍</tspan></text>

  <rect x="64" y="272" width="420" height="4" rx="2" fill="url(#bar)"/>
  <rect x="64" y="272" width="420" height="4" rx="2" fill="#f2d7a3" opacity="0.0"/>
</svg>
